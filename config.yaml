# UKey 管理服务器配置（演示环境）
# 本文件是唯一记录真实地址的地方；密码、令牌只放在 .env 中。
# "添加 / 编辑 Hub"向导会改写本文件（改写前自动备份到 backups/，并保留注释）。

server:
  bind: 0.0.0.0
  port: 8443
  public_url: https://10.70.1.63:8443
  tls_cert: certs/server.crt
  tls_key: certs/server.key
  database: data/ukey.db
  console_admin_user: admin              # 密码：.env 中 CONSOLE_ADMIN_PASSWORD

lease:
  ttl_seconds: 600                       # 演示时可改为 120
  heartbeat_interval_seconds: 15
  heartbeat_timeout_seconds: 45
  command_ack_timeout_seconds: 5
  command_retries: 2
  auto_revoke_orphan_grants: false       # 对账发现无租约的授权时：false 只告警，true 自动回收

grouping:
  mode: per-port                         # 每个 USB 口一个分组
  name_pattern: "{hub}-p{port:02d}"      # 生成 hub-a-p01 … hub-a-p08

hubs:
  - name: hub-a
    address: 10.70.1.208
    model: AW08
    serial: AW08-017363
    ports: 8
    admin_user: admin
    password_env: HUB_PASSWORD_HUB_A
    tls_verify: false                    # Hub 使用自签证书，仅限演示环境
    awusb_service_port: 18574            # Hub 默认值，以阶段 0 探测结果为准
    test_port: 1                         # 阶段 0.5 / 1 的真实写操作只允许在此端口
  # 后续 Hub 用控制台向导添加，或按同样格式追加：
  # - name: hub-b
  #   address: 10.70.1.x
  #   model: AW24
  #   serial: AW24-xxxxxx
  #   ports: 24
  #   admin_user: admin
  #   password_env: HUB_PASSWORD_HUB_B
  #   tls_verify: false
  #   awusb_service_port: 18574

clients:
  client_id_pattern: "ukey-{hostname}"   # 代理设置 Manager Client ID 时使用（仅在尚未设置时）
  authorization_mode: dynamic            # dynamic：按需授权（推荐）；static：向导中预先授予分组

agents:
  enrollment_token_env: AGENT_ENROLLMENT_TOKEN
  auto_approve_ips: []                   # 例如 [10.70.1.92]；为空则所有代理都需在控制台批准
  expected:                              # 仅用于控制台提示，不作为认证依据
    - name: vm-win-1
      ip: 10.70.1.92
      client_id: null                    # 代理注册后由服务器回填

ukeys:                                   # 端口 → UKey 显示名称（可在向导第 3 步修改）
  - {hub: hub-a, port: 1, label: "演示 UKey 1"}
  - {hub: hub-a, port: 2, label: "演示 UKey 2"}

manager_installer:                       # Digi 官方 AnywhereUSB Manager 安装包（用户从 Digi 官网下载后放入 dist/）
  file: dist/REPLACE_WITH_DIGI_INSTALLER.exe
  sha256: "REPLACE_WITH_SHA256"          # sha256sum dist/<文件名>
  install_dir: 'C:\Program Files\Digi\AnywhereUSBManager'

agent_package:
  file: dist/agent.exe                   # Windows 构建机上 build.ps1 的产物
  sha256: "REPLACE_AFTER_BUILD"

remote_install:
  enabled: false                         # 方式 B 远程安装；需先在 VM 上启用 WinRM 或 OpenSSH
  method: winrm                          # winrm | ssh
  winrm_port: 5986
